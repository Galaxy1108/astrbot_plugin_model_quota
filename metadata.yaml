name: astrbot_plugin_model_quota
display_name: 模型自选 · 每日限额
short_desc: 自选对话大模型 + 金额制每日限额（美元配/人民币显）
desc: >-
  提供 /model 指令查看并切换当前对话使用的 AI 大模型（私聊谁都可切，
  群聊仅管理员可切换）；提供 /quota 指令查询当日剩余额度（额度图片卡）。
  管理员按美元配置单价与限额：可选用模型白名单、每人每天每模型限额、每人每天消费总额度、
  每 bot 每日总池与全用户总额（各 bot 独立、不合并）；内置 OpenCode Go 价目与限额预设
  （单价自动换算、峰谷定价、每人每日额度按官方月额度 ÷60），每人每天另有消费总额度，
  管理员默认免限额且不计数。超限自动拦截并提示。另提供 /think 思考强度调整，
  以及 WebUI 插件页面查看每个对话的模型 / 思考强度 / 额度并可按模型重置用量。
version: 1.13.0
author: Galaxy1108
repo: https://github.com/Galaxy1108/astrbot_plugin_model_quota
astrbot_version: ">=4.5.7"
tags:
  - 模型切换
  - 限额管理
  - 用户指令
